name: pureblog

services:
  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pureblog}
      POSTGRES_DB: ${POSTGRES_DB:-pureblog}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-muxi}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      CORS_ORIGINS: '${PUBLIC_ORIGIN:-http://localhost},${ADMIN_ORIGIN:-http://localhost:8081}'
      # Absolute base for uploaded-image URLs; must be the public root origin so
      # images resolve from both the site and the admin preview.
      PUBLIC_ORIGIN: '${PUBLIC_ORIGIN:-http://localhost}'
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8080}:8080'

  web:
    build:
      context: ../frontend
      dockerfile: apps/web/Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE: '${PUBLIC_ORIGIN:-http://localhost}/api/v1'
      NUXT_API_BASE_SERVER: http://backend:8080/api/v1
    depends_on:
      - backend
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'

  admin:
    build:
      context: ../frontend
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_BASE: '${PUBLIC_ORIGIN:-http://localhost}/api/v1'
    depends_on:
      - backend
    ports:
      - '127.0.0.1:${ADMIN_PORT:-8081}:80'

volumes:
  uploads:
